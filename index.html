<!doctype html>
<html lang="en">
  <head>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="index.css" />
    <title>A Battle for the EarthWorld</title>
  </head>
  <body>
    <h1>A Battle for the EarthWorld ⚔️</h1>
    <p>
      Challenge your hero in a bloody battle that will decide the fate of the
      EarthWorld.
    </p>
    <section id="hero-selection" aria-labelledby="selection-title">
      <h2 id="selection-title">Choose your hero</h2>
      <div id="hero-options" class="hero-options"></div>
    </section>
    <main id="battle" hidden>
      <div id="hero"></div>
      <section
        id="battle-message"
        aria-live="polite"
        aria-atomic="true"
        hidden
      ></section>
      <div id="monster"></div>
    </main>
    <section id="actions" hidden>
      <button id="attack-button">Attack</button>
      <button id="hability-button">Hability</button>
      <button id="counter-button">Counter-attack</button>
    </section>
    <script type="module" src="/index.js"></script>
  </body>
</html>
